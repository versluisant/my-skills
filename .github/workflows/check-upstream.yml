name: Check upstream skills

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch: # to run by hands

permissions:
  contents: write # push branch
  pull-requests: write # open PR

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true # clone including submodules
          fetch-depth: 0

      - name: Update submodules to upstream
        id: update
        run: |
          git submodule update --remote --recursive

          # nothing happend, no need in PR
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

          # get PR description: for each submodule — old/new commit and list of commits in between
          {
            echo "Upstream submodules moved:"
            echo
            for path in $(git config --file .gitmodules --get-regexp path | awk '{print $2}'); do
              old=$(git rev-parse "HEAD:$path")
              new=$(git -C "$path" rev-parse HEAD)
              [ "$old" = "$new" ] && continue
              echo "## $path"
              echo "\`${old:0:7}\` → \`${new:0:7}\`"
              echo
              git -C "$path" log --oneline "$old..$new" | sed 's/^/- /'
              echo
            done
          } > /tmp/pr-body.md

      - name: Open or update PR
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B upstream-updates
          git add -A
          git commit -m "chore: bump upstream submodules"
          git push --force origin upstream-updates

          # If PR is already opened — update description, otherwise - create new
          if gh pr view upstream-updates >/dev/null 2>&1; then
            gh pr edit upstream-updates --body-file /tmp/pr-body.md
          else
            gh pr create --title "Upstream skill updates" \
                         --body-file /tmp/pr-body.md \
                         --base main --head upstream-updates
          fi
